[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#102a43"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
paddingBottom = "2rem"
dataframeHeaderBackgroundColor = "#102a43"
dataframeHeaderTextColor = "#ffffff"

[theme.sidebar]
backgroundColor = "#f1f5f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#102a43"
borderColor = "#d6e0ea"
primaryColor = "#0f766e"
